{% load static %}
{# decorative side illustrations beside the sheet (multiply onto creme); sticky so the footer pushes them up, gone on tablets #}
<div class="cv-bg-layer" aria-hidden="true">
  <div class="cv-bg cv-bg--left">
    <picture>
      <source srcset="{% static 'django_resume/img/editorial/bg-cv-left.avif' %}" type="image/avif">
      <img src="{% static 'django_resume/img/editorial/bg-cv-left.webp' %}" alt="" decoding="async">
    </picture>
  </div>
  <div class="cv-bg cv-bg--right">
    <picture>
      <source srcset="{% static 'django_resume/img/editorial/bg-cv-right.avif' %}" type="image/avif">
      <img src="{% static 'django_resume/img/editorial/bg-cv-right.webp' %}" alt="" decoding="async">
    </picture>
  </div>
</div>
