<div id="{{ plugin_name }}-item-{{ language.id }}" aria-label="{{ language.name }}{% if language.note %} – {{ language.note }}{% endif %}" class="bg-slate-50 rounded-lg p-4 border border-slate-200 hover:shadow-md transition-all duration-200 group break-inside-avoid">
  <div class="flex items-center gap-4">
    <div class="w-32 shrink-0 text-lg font-semibold text-slate-800">{{ language.name }}</div>
    <div class="flex-1">
      <div class="h-2 rounded-full bg-slate-200 overflow-hidden print:border print:border-slate-400" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{ language.level }}"
           {% if language.note %}aria-valuetext="{{ language.note }}"{% endif %}>
        <div class="h-full rounded-full bg-blue-600 [print-color-adjust:exact] print:bg-slate-700" style="width: {{ language.level }}%"></div>
      </div>
      {% if language.note %}
        <div class="text-sm text-slate-500 font-medium mt-1 text-right">{{ language.note }}</div>
      {% endif %}
    </div>

    {% if show_edit_button %}
        <div class="flex items-center space-x-1 opacity-0 group-hover:opacity-100 transition-opacity duration-200">
          <button
            class="p-1 text-slate-500 hover:text-blue-600 hover:bg-blue-50 rounded transition-colors duration-200"
            hx-get="{{ language.edit_url }}"
            hx-target="#{{ plugin_name }}-item-{{ language.id }}"
            hx-swap="outerHTML"
            title="Edit entry"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5M16 3l5 5L9 20H4v-5L16 3z"></path>
            </svg>
          </button>
          <button
            class="p-1 text-slate-500 hover:text-red-600 hover:bg-red-50 rounded transition-colors duration-200"
            hx-delete="{{ language.delete_url }}"
            hx-target="#{{ plugin_name }}-item-{{ language.id }}"
            hx-swap="delete"
            hx-confirm="Are you sure you want to delete this entry?"
            title="Delete entry"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
            </svg>
          </button>
        </div>
      {% endif %}
  </div>
</div>
