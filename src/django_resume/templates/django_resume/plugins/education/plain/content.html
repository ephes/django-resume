<section id="education" class="stack">
  {% include education.templates.flat %}
  {% if show_edit_button %}
    <svg class="edit-icon-small" hx-get="{{ education.add_item_url }}" hx-target="#education-items" hx-swap="afterbegin">
      <use href="#add"></use>
    </svg>
  {% endif %}
  <div id="education-items" class="stack">
    {% for entry in education.ordered_entries %}
      {% include education.templates.item with plugin_name=education.plugin_name %}
    {% endfor %}
  </div>
</section>
