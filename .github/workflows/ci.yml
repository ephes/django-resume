name: CI

# Core lint, typecheck and SQLite tests mirror `just check`, in check-only
# mode. A separate synthetic PostgreSQL service checks theme-selection
# interleavings. No secrets are needed. Playwright e2e_tests/ are not run here.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'supersedable' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHONUNBUFFERED: "1"
  UV_FROZEN: "1"
  UV_NO_PROGRESS: "1"
  UV_PYTHON: "3.14"

jobs:
  python:
    name: Lint, typecheck and tests (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked dependencies
        run: uv sync
      - name: Audit locked Python registry dependencies
        run: uv run --frozen python scripts/audit_python.py
      - name: Lint (just lint, check-only)
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Typecheck (just typecheck)
        run: uv run mypy src/
      - name: Tests (just test)
        run: |
          uv run coverage run -m pytest -q
          uv run coverage report

  javascript:
    name: JavaScript tests (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Run vitest
        run: npx vitest run


  postgres-selection:
    name: Theme selection concurrency (PostgreSQL 17)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: resume_test
          POSTGRES_USER: resume
          POSTGRES_PASSWORD: synthetic-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
      - name: Sync locked PostgreSQL test dependencies
        run: uv sync --group postgres
      - name: Test real row-lock interleavings
        env:
          DJANGO_SETTINGS_MODULE: tests.postgres_settings
        run: uv run --group postgres pytest -v tests/theme_selection_concurrency_test.py
